[project]
name = "wa-inbox"
version = "0.1.0"
description = "Turn incoming WhatsApp requests into Google Tasks, without marking anything as read."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []                      # standard library only, on purpose
classifiers = [
  "Environment :: MacOS X",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Communications :: Chat",
  "Topic :: Office/Business :: Scheduling",
]

[project.urls]
Homepage = "https://github.com/AlexBloch-IA/wa-inbox"
Issues = "https://github.com/AlexBloch-IA/wa-inbox/issues"

[project.scripts]
wa-inbox = "wa_inbox.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["wa_inbox"]

[tool.setuptools.package-data]
wa_inbox = ["schema.json", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
